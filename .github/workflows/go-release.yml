name: Release

on:
  workflow_call:
    inputs:
      enable-syft:
        description: 'Generate SBOM with syft'
        type: boolean
        default: true
      enable-pre-release-test:
        description: 'Run tests before GoReleaser'
        type: boolean
        default: true
      enable-homebrew-verify:
        description: 'Verify HOMEBREW_TAP_GITHUB_TOKEN permissions'
        type: boolean
        default: true
    secrets:
      HOMEBREW_TAP_GITHUB_TOKEN:
        required: false
      SCOOP_BUCKET_GITHUB_TOKEN:
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        if: inputs.enable-syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Run pre-release tests
        if: inputs.enable-pre-release-test
        run: go test ./... -race

      - name: Verify Homebrew tap token
        if: inputs.enable-homebrew-verify
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Missing HOMEBREW_TAP_GITHUB_TOKEN::Create a GitHub token that can write contents to thedavidweng/homebrew-tap before running a release."
            exit 1
          fi
          can_push="$(gh api repos/thedavidweng/homebrew-tap --jq '.permissions.push')"
          if [ "$can_push" != "true" ]; then
            echo "::error title=Invalid HOMEBREW_TAP_GITHUB_TOKEN::The token must have write access to thedavidweng/homebrew-tap."
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
